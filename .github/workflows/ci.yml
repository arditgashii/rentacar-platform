name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/terraform
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/drivenow && helm template ci deploy/helm/drivenow > /dev/null

  docker-stack:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: COMMIT=${{ github.sha }} docker compose up -d --build --wait --wait-timeout 300 api
      - name: Check readiness
        run: |
          # The Service Bus emulator needs a few seconds after its container starts.
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && break; sleep 5; done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS "http://localhost:8000/api/v1/cars?page_size=1" | grep -q '"total":22'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v
        if: always()
