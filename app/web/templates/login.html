{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  {% if error %}<div class="flash flash-error" role="alert" data-testid="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" data-testid="login-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required data-testid="login-email">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required data-testid="login-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit" data-testid="login-submit">Log in</button>
  </form>
  <p class="muted small">No account yet? <a href="/register" data-testid="login-register-link">Sign up</a></p>
</div>
{% endblock %}
