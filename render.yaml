# Public demo on Render (free plan): one container with SQLite, photos on its disk and events in
# memory instead of SQL Server, Blob Storage and Service Bus. The disk is not kept, so every start
# begins with fresh seed data. The full stack runs with docker compose (see README).
services:
  - type: web
    name: drivenow
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/drivenow.db
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage
      - key: MESSAGING_BACKEND
        value: memory
      - key: SECRETS_BACKEND
        value: env
      - key: SEED_ON_START
        value: "true"
      - key: DRIVENOW_BUGS
        value: "on"
      - key: LLM_PROVIDER
        value: mock
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
